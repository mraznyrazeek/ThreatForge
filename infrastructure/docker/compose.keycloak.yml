name: threatforge-keycloak

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: start-dev
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    env_file:
      - .env.keycloak

    environment:
      KC_HOSTNAME: http://localhost:8080
      KC_HEALTH_ENABLED: "true"

    volumes:
      - keycloak_data:/opt/keycloak/data

    mem_limit: 1g

volumes:
  keycloak_data:
